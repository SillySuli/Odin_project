<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sign Up form</title>
    <link rel="shortcut icon" type="image/png" href="./media/odin-lined.png"/>
    <link rel="stylesheet" href="styles.css"/>
  </head>

  <body>
    <div class="odin-header">

      <div class="black-transparent-container">
        <img  
          class="icon-image" 
          src="media/odin-lined.png"
          height= 150
          width= auto
        />
        <p>ODIN</p>
      </div>
      <p class="credits">Photo by <u>Erin DeFuria</u> on <u>Unsplash</u>.</p>

    </div>
    <div class="form-container">
      <p class="quote side-margin">This is not a real online service! You know you need something
        like this in your life to help you realize your deepest dreams.
        <br>Sign up <i>now</i> to get started.</p>

      <p class="quote margin side-margin">You <i>know</i> you want to</P>

      <div class= "form-backdrop">
        <p class="quote margin side-margin">Let's do this!</p>

        <form method="post" id="sign-up" class="side-margin">
          <div class="form-row">
            <div class="form-element">
              <label for="first-name">First name</label>
              <input id="first-name" name="first-name" type="text" required/>
            </div>

            <div class="form-element">
              <label for="last-name">Last name</label>
              <input id="last-name" name="last-name" type="text" required/>
            </div>
          </div>

          <div class="form-row">
            <div class="form-element">
              <label for="email">email</label>
              <input id="first-name" name="email" type="email" required/>
            </div>

            <div class="form-element">
              <label for="phone-number">phone number</label>
              <input id="phone-number" name="phone-number" type="tel" required/>
            </div>
          </div>

          <div class="form-row">
            <div class="form-element">
              <label for="password">password</label>
              <input id="password" name="password" type="password" required/>
            </div>

            <div class="form-element">
              <label for="confirm-password">confirm password</label>
              <input id="confirm-password" name="confirm-password" type="password" required/>
            </div>
          </div>
        </form>

      </div>
        <button class="side-margin" type="submit" form="sign-up">Create Account</button>
    </div>
  </body>
</html>
