<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css"/>
    <title>Dashboard</title>
  </head>

  <body>
    <div class="root-container">
      <div class="sidebar">
        <span class="sidebar-item">
          <img src="material/view-dashboard.svg" class="header-icon fill-white"/>
          <h1>Dashboard</h1>
        </span>

        <ul>
          <li>
            <span class="sidebar-item">
              <img 
                src="material/home.svg" 
                class="icon fill-white"/> 
                <h2>Home</h2>
            </span>
          </li>
          <li>
            <span class="sidebar-item">
              <img 
                src="material/card-account-details.svg" 
                class="icon fill-white"/> 
                <h2>Profile</h2>
            </span>
          </li>
          <li>
            <span class="sidebar-item">
              <img 
                src="material/clock-time-three.svg" 
                class="icon fill-white"/> 
                <h2>History</h2>
            </span>
          </li>
          <li>
            <span class="sidebar-item">
              <img 
                src="material/calendar-check.svg" 
                class="icon fill-white"/> 
                <h2>Task</h2>
            </span>
          </li>
          <li>
            <span class="sidebar-item">
              <img 
                src="material/account-group.svg" 
                class="icon fill-white"/> 
                <h2>Communities</h2>
            </span>
          </li>
          </ul>


        <ul>
          <li>
            <span class="sidebar-item">
              <img 
                src="material/cog.svg" 
                class="icon fill-white"/> 
                <h2>Setting</h2>
            </span>
          </li>
          <li>
            <span class="sidebar-item">
              <img 
                src="material/lifebuoy.svg" 
                class="icon fill-white"/> 
                <h2>Support</h2>
            </span>
          </li>
          <li>
            <span class="sidebar-item">
              <img 
                src="material/shield-check.svg" 
                class="icon fill-white"/> 
                <h2>Privacy</h2>
            </span>
          </li>
        </ul>

      </div>

      <div class="header">
      </div>

      <div class="main-content">
      </div>
    </div>
  </body>
</html>
